# Değerlendirme etiketleri — agent girdisinden AYRI tutulur; yalnız tests/test_scenarios.py ve eval/run_eval.py okur.
# primary: beklenen birincil mekanizma (null = mekanizma yok); sources/affected: beklenen kaynak/etkilenen kümesi.
normal:            {primary: null, sources: [], affected: [], max_score: 25}
independent_load:  {primary: independent_load, sources: [flightops-service], affected: [], max_score: 25,
                    not_impacted: [reservation-service, checkin-service, baggage-service]}
row_lock:          {primary: row_lock, sources: [reservation-service], affected: [checkin-service], min_score: 50,
                    secondary: [pool_saturation]}
single_pool:       {primary: pool_saturation, sources: [baggage-service], affected: [baggage-service],
                    not_mechanisms: [row_lock, global_connection_pressure],
                    not_impacted: [reservation-service, checkin-service, flightops-service]}
global_connection: {primary: global_connection_pressure, sources: [reservation-service]}
db_cpu:            {primary: db_cpu, sources: [checkin-service], not_mechanisms: [app_vm_cpu]}
app_vm_cpu:        {primary: app_vm_cpu, sources: [baggage-service], not_mechanisms: [db_cpu]}
two_sources:       {mechanisms: [row_lock, pool_saturation], sources_any: [reservation-service, baggage-service]}
conn_relative:     {primary: global_connection_pressure, sources_any: [flightops-service]}
conn_small_rise:   {not_mechanisms: [global_connection_pressure]}
container_cpu:     {primary: app_container_cpu, sources: [baggage-service], not_mechanisms: [app_vm_cpu, db_cpu]}
network_path:      {primary: network_path_latency, sources: [checkin-service], secondary: [pool_saturation],
                    not_mechanisms: [row_lock, db_cpu, global_connection_pressure, app_vm_cpu]}
pool_hold_not_network: {primary: pool_saturation, sources: [checkin-service], not_mechanisms: [network_path_latency]}
tail_latency:      {impacted: [reservation-service], not_impacted: [checkin-service, flightops-service, baggage-service]}
missing_telemetry: {quality_not_ok: [spans, edges, hikari, collector], lock_unknown: true}
stale_telemetry:   {quality_stale: [hosts, db_conn]}
# PostgreSQL workload mechanism'leri
deadlock:          {primary: deadlock, sources: [checkin-service, reservation-service], affected: [checkin-service],
                    mechanisms: [row_lock], not_mechanisms: [serialization_conflict]}
single_deadlock:   {not_mechanisms: [deadlock]}
serialization:     {primary: serialization_conflict, sources: [flightops-service, checkin-service],
                    not_mechanisms: [deadlock, write_pressure]}
temp_spill:        {primary: temp_file_pressure, sources: [baggage-service], not_mechanisms: [write_pressure, read_pressure]}
bulk_insert:       {primary: write_pressure, sources: [checkin-service], not_mechanisms: [update_churn, read_pressure, db_cpu]}
commit_storm:      {primary: write_pressure, sources: [baggage-service], not_mechanisms: [update_churn]}
commit_storm_cheap: {primary: write_pressure, sources: [flightops-service, checkin-service], not_mechanisms: [update_churn, query_flood]}
update_churn:      {primary: update_churn, sources: [reservation-service], not_mechanisms: [write_pressure, idle_in_transaction]}
vacuum_blocked:    {primary: update_churn, mechanisms: [update_churn, idle_in_transaction],
                    not_mechanisms: [network_path_latency, write_pressure]}
heavy_read:        {primary: read_pressure, sources: [checkin-service], mechanisms: [db_cpu], not_mechanisms: [write_pressure]}
db_memory:         {primary: db_memory_pressure, sources: [reservation-service], not_mechanisms: [db_cpu]}
idle_in_tx:        {primary: idle_in_transaction, sources_any: [checkin-service, flightops-service],
                    not_mechanisms: [network_path_latency, row_lock, update_churn]}
busy_traffic:      {primary: null, not_mechanisms: [deadlock, serialization_conflict, temp_file_pressure, write_pressure, update_churn, read_pressure, db_memory_pressure, idle_in_transaction, query_flood, table_lock, advisory_lock]}
table_lock:        {primary: table_lock, sources: [reservation-service], affected: [checkin-service],
                    not_mechanisms: [row_lock, advisory_lock]}
advisory_lock:     {primary: advisory_lock, sources: [flightops-service], not_mechanisms: [row_lock, table_lock]}
point_queries:     {primary: query_flood, sources: [flightops-service, checkin-service],
                    not_mechanisms: [write_pressure, read_pressure, independent_load]}
heavy_calls:       {not_mechanisms: [query_flood]}
